<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .input-container {
            display: flex;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
        }

        #addTaskBtn {
            padding: 10px 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        #addTaskBtn:hover {
            background-color: #27ae60;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 15px;
            margin: 0 5px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .filter-btn:hover {
            background-color: #2980b9;
        }

        .filter-btn.active {
            background-color: #2c3e50;
        }

        #taskList {
            list-style-type: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            transition: all 0.3s;
        }

        .task-item:hover {
            background-color: #f0f0f0;
        }

        .task-item.completed {
            background-color: #e8f8f5;
            text-decoration: line-through;
            color: #888;
        }

        .task-checkbox {
            margin-right: 10px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        .task-count {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add Task</button>
        </div>
        
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        
        <ul id="taskList"></ul>
        
        <div class="task-count">
            <span id="remainingCount">0</span> tasks remaining
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const taskInput = document.getElementById('taskInput');
            const addTaskBtn = document.getElementById('addTaskBtn');
            const taskList = document.getElementById('taskList');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const remainingCount = document.getElementById('remainingCount');
            
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            let currentFilter = 'all';
            
            // Render tasks based on current filter
            function renderTasks() {
                taskList.innerHTML = '';
                
                const filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'all') return true;
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    return true;
                });
                
                if (filteredTasks.length === 0) {
                    const emptyMessage = document.createElement('li');
                    emptyMessage.textContent = currentFilter === 'all' ? 'No tasks yet' : 
                                              currentFilter === 'active' ? 'No active tasks' : 
                                              'No completed tasks';
                    emptyMessage.style.textAlign = 'center';
                    emptyMessage.style.color = '#7f8c8d';
                    emptyMessage.style.padding = '20px';
                    taskList.appendChild(emptyMessage);
                } else {
                    filteredTasks.forEach((task, index) => {
                        const taskItem = document.createElement('li');
                        taskItem.className = 'task-item' + (task.completed ? ' completed' : '');
                        
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.className = 'task-checkbox';
                        checkbox.checked = task.completed;
                        checkbox.addEventListener('change', () => toggleTaskCompleted(index));
                        
                        const taskText = document.createElement('span');
                        taskText.className = 'task-text';
                        taskText.textContent = task.text;
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.textContent = 'Delete';
                        deleteBtn.addEventListener('click', () => deleteTask(index));
                        
                        taskItem.appendChild(checkbox);
                        taskItem.appendChild(taskText);
                        taskItem.appendChild(deleteBtn);
                        
                        taskList.appendChild(taskItem);
                    });
                }
                
                updateRemainingCount();
            }
            
            // Add a new task
            function addTask() {
                const text = taskInput.value.trim();
                if (text !== '') {
                    tasks.push({ text, completed: false });
                    saveTasks();
                    taskInput.value = '';
                    renderTasks();
                }
            }
            
            // Toggle task completed status
            function toggleTaskCompleted(index) {
                // Find the actual index in the original tasks array
                const filteredTasks = getFilteredTasks();
                const task = filteredTasks[index];
                const originalIndex = tasks.findIndex(t => t.text === task.text);
                
                tasks[originalIndex].completed = !tasks[originalIndex].completed;
                saveTasks();
                renderTasks();
            }
            
            // Delete a task
            function deleteTask(index) {
                // Find the actual index in the original tasks array
                const filteredTasks = getFilteredTasks();
                const task = filteredTasks[index];
                const originalIndex = tasks.findIndex(t => t.text === task.text);
                
                tasks.splice(originalIndex, 1);
                saveTasks();
                renderTasks();
            }
            
            // Get filtered tasks based on current filter
            function getFilteredTasks() {
                return tasks.filter(task => {
                    if (currentFilter === 'all') return true;
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    return true;
                });
            }
            
            // Update remaining tasks count
            function updateRemainingCount() {
                const count = tasks.filter(task => !task.completed).length;
                remainingCount.textContent = count;
            }
            
            // Save tasks to localStorage
            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }
            
            // Event listeners
            addTaskBtn.addEventListener('click', addTask);
            
            taskInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
            
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderTasks();
                });
            });
            
            // Initial render
            renderTasks();
        });
    </script>
</body>
</html>
